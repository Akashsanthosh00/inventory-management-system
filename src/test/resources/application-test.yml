# Fast profile used by the *Test classes: H2 in PostgreSQL mode, in-memory cache, no RabbitMQ consumers.
spring:
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rate-limit:
    capacity: 100000
    auth-capacity: 100000
  low-stock:
    cron: "-"   # disable the scheduled trigger; tests call the service directly
